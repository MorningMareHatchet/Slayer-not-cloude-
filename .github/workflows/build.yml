name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          echo "Files in repo:"; ls -la
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT=$PWD" >> $GITHUB_ENV
          else
            Z=$(find . -iname "*.zip" -not -path "./.git/*" | head -n1)
            if [ -z "$Z" ]; then echo "ZIP NOT FOUND"; exit 1; fi
            echo "Using $Z"
            mkdir -p /tmp/p
            unzip -q "$Z" -d /tmp/p
            D=$(dirname "$(find /tmp/p -name settings.gradle.kts | head -n1)")
            echo "PROJECT=$D" >> $GITHUB_ENV
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT }}
      - uses: actions/upload-artifact@v4
        with:
          name: SlayerBot-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
